name: Deploy SPA CF Workers[一体化部署]
on:
  workflow_dispatch:
jobs:
  inspect-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read database schema and migration state only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}`;
          const headers = {Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'Content-Type': 'application/json'};
          async function api(path, sql) {
            const response = await fetch(base + path, {headers, ...(sql ? {method: 'POST', body: JSON.stringify({sql})} : {})});
            const body = await response.json();
            if (!response.ok || !body.success) throw new Error(JSON.stringify(body.errors));
            return body.result;
          }
          const databases = await api('/d1/database?per_page=100');
          const db = databases.find(db => db.name === 'cloudpaste-db');
          if (!db) throw new Error('cloudpaste-db not found');
          const query = sql => api(`/d1/database/${db.uuid}/query`, sql);
          for (const sql of [
            "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name",
            "PRAGMA table_info(pastes)",
            "SELECT key, value FROM system_settings WHERE key IN ('schema_version','db_initialized')",
            "SELECT id FROM schema_migrations ORDER BY id",
            "SELECT 'admins' AS name, COUNT(*) AS count FROM admins UNION ALL SELECT 'pastes', COUNT(*) FROM pastes UNION ALL SELECT 'files', COUNT(*) FROM files",
          ]) {
            console.log(sql, JSON.stringify(await query(sql)));
          }
          JS
